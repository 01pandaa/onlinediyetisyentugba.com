name: Check dietitian website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dietitian-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static pages
        run: python3 scripts/build.py
      - name: Check links and search metadata
        run: python3 scripts/check.py
      - name: Check BMI calculation and input handling
        run: node scripts/check-calculator.cjs
      - name: Verify committed publishing files are current
        run: git diff --exit-code -- '*.html' sitemap.xml robots.txt feed.xml .generated-pages.json
      # GitHub Pages publishes main/root. Keeping one deployment path avoids
      # a second workflow replacing the website with a different build.
