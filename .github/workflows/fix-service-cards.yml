name: Fix service cards layout once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-service-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply service card styling
        shell: python
        run: |
          from pathlib import Path
          import json

          build_path=Path('scripts/build.py')
          text=build_path.read_text()
          text=text.replace("/assets/style.css')}?v=horizontal-logo-v1", "/assets/style.css')}?v=services-cards-v4")
          build_path.write_text(text)

          css_path=Path('assets/style.css')
          css=css_path.read_text()
          marker='/* services-cards-v4 */'
          if marker not in css:
              css += r'''

          /* services-cards-v4 */
          .services-catalog-grid{
            display:grid!important;
            grid-template-columns:repeat(3,minmax(0,1fr))!important;
            gap:24px!important;
            margin-top:30px!important;
            align-items:stretch;
          }
          .service-card-v2{
            display:flex!important;
            flex-direction:column!important;
            min-height:330px!important;
            padding:28px!important;
            border:1px solid #d8e5d9!important;
            border-top:3px solid #2b7a4b!important;
            border-radius:22px!important;
            background:#ffffff!important;
            box-shadow:0 12px 36px rgba(21,61,46,.08)!important;
            overflow:hidden;
          }
          .service-card-v2:nth-child(3n+2){background:#f2f8ec!important;}
          .service-card-v2:hover{
            transform:translateY(-5px)!important;
            box-shadow:0 20px 48px rgba(21,61,46,.14)!important;
            border-color:#b9d4bd!important;
          }
          .service-icon-v2{
            display:grid!important;
            place-items:center!important;
            width:58px!important;
            height:58px!important;
            margin-bottom:22px!important;
            border-radius:18px!important;
            background:#e6f3e8!important;
            font-size:29px!important;
            box-shadow:inset 0 0 0 1px rgba(43,122,75,.06);
          }
          .service-card-v2 h3{
            margin:0 0 13px!important;
            font-family:Inter,"Segoe UI",Arial,sans-serif!important;
            font-size:22px!important;
            line-height:1.2!important;
            font-weight:700!important;
            letter-spacing:-.025em!important;
            color:#123e2e!important;
          }
          .service-card-v2 p{
            margin:0 0 20px!important;
            color:#5d6f63!important;
            font-size:15px!important;
            line-height:1.62!important;
          }
          .service-card-v2 ul{
            display:grid!important;
            gap:9px!important;
            margin:auto 0 0!important;
            padding:0!important;
            list-style:none!important;
            color:#243b2e!important;
            font-size:14px!important;
          }
          .service-card-v2 li{position:relative;padding-left:24px!important;}
          .service-card-v2 li:before{
            content:'✓'!important;
            position:absolute!important;
            left:0!important;
            color:#259451!important;
            font-weight:800!important;
          }
          @media(max-width:980px){
            .services-catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
          }
          @media(max-width:620px){
            .services-catalog-grid{grid-template-columns:1fr!important;gap:16px!important;}
            .service-card-v2{min-height:0!important;padding:23px!important;}
          }
          '''
          css_path.write_text(css)

          site_path=Path('content/site.json')
          site=json.loads(site_path.read_text())
          site['updated']='2026-09-09'
          site.setdefault('page_updates',{})['/hizmetler/']='2026-09-09'
          site_path.write_text(json.dumps(site,ensure_ascii=False,indent=2)+'\n')
      - name: Build generated pages
        run: python3 scripts/build.py
      - name: Validate site
        run: python3 scripts/check.py
      - name: Commit layout fix
        run: |
          git config user.name "01pandaa"
          git config user.email "135593827+01pandaa@users.noreply.github.com"
          git add scripts/build.py assets/style.css content/site.json '*.html' sitemap.xml robots.txt feed.xml .generated-pages.json */index.html */*/index.html 2>/dev/null || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use polished grid cards for dietitian services"
          git push
