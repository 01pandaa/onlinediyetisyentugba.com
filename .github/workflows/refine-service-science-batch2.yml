name: Refine service science batch 2

on:
  push:
    paths:
      - '.github/workflows/refine-service-science-batch2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply evidence-based service updates
        run: python scripts/refine-service-science-batch2.py
      - name: Validate JSON and build
        run: |
          python -m json.tool content/services.json >/dev/null
          python -m json.tool content/site.json >/dev/null
          python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refine-service-science-batch2.yml
          git add -A
          git commit -m "Deepen pregnancy sports vegan and weight management service content" || exit 0
          git push
