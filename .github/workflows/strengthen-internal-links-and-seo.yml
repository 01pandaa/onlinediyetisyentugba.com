name: Strengthen internal links and SEO once

on:
  push:
    paths:
      - '.github/workflows/strengthen-internal-links-and-seo.yml'

permissions:
  contents: write

jobs:
  refine-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Strengthen internal links and SEO checks
        run: python scripts/strengthen-internal-links-and-seo-checks.py
      - name: Build website
        run: python scripts/build.py
      - name: Validate technical SEO and links
        run: python scripts/check.py
      - name: Check calculator
        run: node scripts/check-calculator.cjs
      - name: Commit refined site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py scripts/check.py .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Strengthen internal links and technical SEO checks"
            git push
          fi
