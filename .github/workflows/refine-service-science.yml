name: Refine scientific service pages once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-service-science.yml'
permissions:
  contents: write
jobs:
  refine-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refine service science content
        run: python3 scripts/refine-service-science.py
      - name: Build website
        run: python3 scripts/build.py
      - name: Validate website
        run: python3 scripts/check.py
      - name: Check calculator
        run: node scripts/check-calculator.cjs
      - name: Commit refinements
        run: |
          git config user.name "01pandaa"
          git config user.email "135593827+01pandaa@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine service pages with evidence-based content"
            git push
          fi
