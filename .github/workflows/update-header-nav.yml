name: Update header navigation once

on:
  push:
    paths:
      - '.github/workflows/update-header-nav.yml'

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update navigation
        run: python scripts/update_header_nav.py
      - name: Build website
        run: python scripts/build.py
      - name: Validate website
        run: |
          if [ -f scripts/check_site.py ]; then python scripts/check_site.py; fi
      - name: Commit navigation and generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update header navigation and add pricing link"
            git push
          fi
